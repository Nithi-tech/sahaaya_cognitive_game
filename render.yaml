services:
  - type: web
    name: sahaaya-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SAHAAYA_JWT_SECRET
        generateValue: true
      - key: SAHAAYA_DB_PATH
        value: /data/sahaaya.db
    disk:
      name: sahaaya-data
      mountPath: /data
      sizeGB: 1
