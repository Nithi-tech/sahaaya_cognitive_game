services:
  - type: web
    name: sahaaya-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev is required: NODE_ENV=production (set below) makes plain
    # `npm install` skip devDependencies — which is where typescript and every
    # @types/* package live. Without this the build fails with TS7016/TS7006
    # errors (tsc runs from a stray global install but can't find types).
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SAHAAYA_JWT_SECRET
        generateValue: true
    # No SAHAAYA_DB_PATH and no `disk:` block — free-tier web services can't
    # attach a persistent disk, so we leave SAHAAYA_DB_PATH unset and let
    # server/src/db.ts fall back to its default (server/sahaaya.db, inside the
    # deployed app's own directory — guaranteed writable, no path guessing).
    # That file lives on the container's local filesystem, which is ephemeral
    # across redeploys (not across idle spin-down/wake — only an actual new
    # deploy wipes it). The server auto-seeds demo accounts on boot, so a
    # wiped DB just resets to the demo dataset next deploy — any real data
    # added during a session (extra reminders/sessions/memories) is lost then.
    # Upgrade to a paid plan and add back a `disk:` block (mountPath e.g.
    # /data, with SAHAAYA_DB_PATH pointing there) for real persistence.
